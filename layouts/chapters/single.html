{{ define "main" }}
<div class="container poem-page">
  <div class="poem-header">
    <div class="breadcrumb">
      <a href="/books/{{ .Params.book_parent | urlize }}/">← ग्रन्थ पर लौटें (Back to Book)</a>
    </div>
    <h1 class="poem-title">{{ .Title }}</h1>
  </div>
  
  <div class="shlokas-content poem-body">
    {{ .Content }}
  </div>
</div>
{{ end }}
