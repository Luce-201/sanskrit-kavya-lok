{{ define "main" }}
<div class="list-page">
  <header class="list-header">
    <h1>काव्यानि <span class="en">Poems</span></h1>
    <p>{{ len .Pages }} काव्यानि / poems</p>
  </header>
  <div class="content-list">
    {{ range .Pages }}
    <a href="{{ .RelPermalink }}" class="content-list-row">
      <div class="content-list-text">
        <span class="content-list-title">{{ .Title }}</span>
        {{ with .Params.poet }}<span class="content-list-sub">{{ . }}</span>{{ end }}
      </div>
      <div class="content-list-right">
        {{ with .Params.form }}<span class="rk-form-badge">{{ . }}</span>{{ end }}
        {{ if .Params.audio_url }}<span class="rk-audio-dot" title="Audio available">🎵</span>{{ end }}
        <svg class="content-list-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
        </svg>
      </div>
    </a>
    {{ end }}
  </div>
</div>
{{ end }}
