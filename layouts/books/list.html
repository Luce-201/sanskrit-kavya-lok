{{ define "main" }}
<div class="container" style="max-width: 1200px; margin: 0 auto; padding: 40px 20px;">
  <h1 style="text-align: center; margin-bottom: 50px; font-family: 'Tiro Devanagari Sanskrit', serif;">ग्रन्थाः / Books</h1>
  
  <div class="books-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px;">
    {{ range .Pages }}
      <a href="{{ .Permalink }}" style="text-decoration: none; color: inherit; display: block;">
        <div class="book-card" style="background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; padding: 30px; transition: all 0.3s ease; height: 100%; display: flex; flex-direction: column;">
          
          <h2 style="margin-top: 0; margin-bottom: 15px; font-family: 'Tiro Devanagari Sanskrit', serif; font-size: 1.8rem; color: #e6e6e6;">
            {{ .Title }}
          </h2>
          
          {{ if .Params.poet }}
            <p style="margin: 0; font-size: 1.1rem; color: #a0a0a0; font-family: 'Lora', serif;">
              <strong>कवि:</strong> {{ .Params.poet }}
            </p>
          {{ end }}
          
          <div style="margin-top: auto; padding-top: 25px; font-size: 0.95rem; color: #9B6DFF; text-transform: uppercase; letter-spacing: 1px; font-weight: 600;">
            ग्रन्थ पढ़ें (Read) →
          </div>
          
        </div>
      </a>
    {{ end }}
  </div>
</div>

<style>
  .book-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    border-color: rgba(155, 109, 255, 0.4) !important;
    background: rgba(255, 255, 255, 0.05);
  }
</style>
{{ end }}
