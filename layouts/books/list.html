{{ define "main" }}
<div class="collection-page">
    <div class="collection-header">
        <h1 class="collection-title">{{ .Title }}</h1>
    </div>

    <div class="book-grid">
        {{ if .Sections }}
            {{ range .Sections }}
            <a href="{{ .RelPermalink }}" class="book-card">
                <h2 class="book-card-title">{{ .Title }}</h2>
                <p class="book-card-meta">Enter Library &rarr;</p>
            </a>
            {{ end }}
        
        {{ else }}
            {{ range .RegularPages.ByWeight }}
            <a href="{{ .RelPermalink }}" class="chapter-card">
                <h2 class="chapter-card-title">{{ .Title }}</h2>
                <p class="chapter-card-meta">Read Sarga &rarr;</p>
            </a>
            {{ end }}
        {{ end }}
    </div>
</div>
{{ end }}
